<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwali Fresh Food Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #0c183a;
    --bg-b: #142a52;
    --bg-c: #030712;
    --surface: rgba(255,255,255,0.045);
    --gold: #8ecae6;
    --coral: #e3b23c;
    --cream: #f0f2f5;
    --muted: #9fb3c8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    overflow: hidden; /* the stage is scaled to fit, so the page itself never scrolls */
  }
  body {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 900px 600px at 15% -5%, rgba(142,202,230,0.14), transparent 60%),
      radial-gradient(ellipse 900px 700px at 100% 100%, rgba(227,178,60,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
  }
  /* .content is a fixed-size "design canvas". JS scales it as one unit to fit
     whatever window/screen it's displayed on, so spacing and text scale together
     instead of reflowing or scrolling. */
  .content {
    position: relative; z-index: 1;
    width: 1800px;
    padding: 40px 60px;
    transform-origin: center center;
  }
  .logo { display: block; margin: 0 auto 28px; height: 92px; width: auto; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 36px 40px; }
  .category {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 22px 26px;
    backdrop-filter: blur(6px);
  }
  .category h2 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    color: var(--coral);
    text-transform: uppercase;
    font-size: 30px;
    margin: 0 0 14px;
    letter-spacing: 0.03em;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 26px;
    font-weight: 500;
    padding: 10px 0;
  }
  .item-name { white-space: nowrap; }
  .dots { flex: 1; border-bottom: 2px dotted rgba(240,242,245,0.18); transform: translateY(-6px); }
  .item-price { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--gold); }
  .state {
    position: relative; z-index: 1; text-align: center; margin-top: 6vh;
    color: var(--muted); font-size: 24px;
  }
</style>
</head>
<body>
  <div class="content" id="content">
    <img class="logo" src="assets/logo.png" alt="An Ocean of Virtues">
    <div class="grid" id="grid"></div>
    <div class="state" id="state" hidden>Loading menu&hellip;</div>
  </div>

<script>
  // ---- Point this at your sheet ----
  var SHEET_ID = '1G4Bwv_KSM-tPCvDV-A2D6amdks73Un0qHPcwxbp7gCw';
  var GID = 0; // first tab, regardless of its name
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + GID;
  var REFRESH_MS = 60000;

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Minimal CSV parser: handles quoted fields and escaped quotes ("").
  function parseCsv(text) {
    var rows = [], row = [], field = '', inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i], next = text[i + 1];
      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && next === '\n') i++;
          row.push(field); field = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
        } else field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Day -> real calendar date, used by "Auto" mode to pick the active day.
  // Update these to match the actual event dates once finalized (YYYY-MM-DD,
  // read in the venue's local time). Until then, Auto falls back to Day 1.
  var DAY_DATES = {
    1: '2026-11-07',
    2: '2026-11-08',
    3: '2026-11-09',
    4: '2026-11-10'
  };

  // Finds the column index for each "Day N" header (matches a prefix, so
  // "Day 1 (Sat 11/7)" still matches "Day 1").
  function findDayColumns(header) {
    var days = [];
    for (var n = 1; n <= 4; n++) {
      var prefix = 'Day ' + n;
      var found = -1;
      for (var c = 0; c < header.length; c++) {
        if (String(header[c]).trim().indexOf(prefix) === 0) { found = c; break; }
      }
      days.push(found);
    }
    return days;
  }

  function isChecked(val) {
    var v = String(val || '').trim().toUpperCase();
    return v === 'TRUE' || v === 'Y' || v === 'YES';
  }

  function todayStr() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  }

  // Override cell can be "Auto", "Day 1".."Day 4", or blank (treated as Auto).
  function resolveActiveDay(overrideVal) {
    var m = String(overrideVal || '').trim().match(/^Day\s*([1-4])$/i);
    if (m) return parseInt(m[1], 10);
    var today = todayStr();
    for (var n = 1; n <= 4; n++) {
      if (DAY_DATES[n] === today) return n;
    }
    return 1; // Auto with no date match yet (or dates not configured) -> Day 1
  }

  function buildCategories(rows) {
    var header = rows[0] || [];
    var idx = {
      category: header.indexOf('Category'),
      item: header.indexOf('Item'),
      price: header.indexOf('Price'),
      override: header.indexOf('Override'),
    };
    var dayIdx = findDayColumns(header);

    var overrideVal = '';
    if (idx.override !== -1) {
      for (var r = 1; r < rows.length; r++) {
        var v = rows[r][idx.override];
        if (v && String(v).trim()) { overrideVal = v; break; }
      }
    }
    var activeCol = dayIdx[resolveActiveDay(overrideVal) - 1];

    var categories = {}, order = [];
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var item = row[idx.item];
      if (!item) continue;
      if (activeCol === -1 || !isChecked(row[activeCol])) continue; // not on today's menu
      var category = row[idx.category] || 'Other';
      if (!categories[category]) { categories[category] = []; order.push(category); }
      categories[category].push({ name: item, price: row[idx.price] });
    }
    order = order.filter(function (cat) { return categories[cat].length > 0; }); // drop categories with nothing left to show
    return { categories: categories, order: order };
  }

  function render(data) {
    var grid = document.getElementById('grid');
    var state = document.getElementById('state');
    var html = data.order.map(function (cat) {
      var items = data.categories[cat].map(function (it) {
        return (
          '<li class="item">' +
          '<span class="item-name">' + escapeHtml(it.name) + '</span>' +
          '<span class="dots"></span>' +
          '<span class="item-price">$' + escapeHtml(it.price) + '</span>' +
          '</li>'
        );
      }).join('');
      return (
        '<section class="category"><h2>' + escapeHtml(cat) + '</h2><ul>' + items + '</ul></section>'
      );
    }).join('');
    grid.innerHTML = html;
    state.hidden = true;
    grid.hidden = false;
    fitToScreen();
  }

  // Scales the whole .content block as one unit so it always fills the
  // window without ever needing to scroll, however many items/categories
  // are on the menu. Caps how far it scales up so a very short menu doesn't
  // blow up into giant text.
  var MAX_SCALE = 1.4;
  function fitToScreen() {
    var content = document.getElementById('content');
    content.style.transform = 'scale(1)';
    var w = content.offsetWidth, h = content.offsetHeight;
    if (!w || !h) return;
    var scale = Math.min(window.innerWidth / w, window.innerHeight / h, MAX_SCALE);
    content.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitToScreen);

  function load() {
    fetch(CSV_URL, { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('fetch failed'); return res.text(); })
      .then(function (text) { render(buildCategories(parseCsv(text))); })
      .catch(function () {
        // Keep whatever is currently shown; only show the error if we have nothing yet.
        var grid = document.getElementById('grid');
        if (!grid.innerHTML) {
          document.getElementById('state').hidden = false;
          document.getElementById('state').textContent = 'Menu unavailable — check connection.';
        }
      });
  }

  fitToScreen();
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
