<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwali Fresh Food Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #283044;
    --bg-b: #3a3451;
    --bg-c: #1b2131;
    --surface: rgba(255,255,255,0.045);
    --cream: #d8cfaf;
    --mauve: #a27e8e;
    --blue: #a9cbdb;
    --maroon: #660000;
    --maroon-light: #8a2a2a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
  }
  body {
    position: relative;
    padding: 3vh 4vw 6vh;
    background: linear-gradient(165deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
  }
  .content { position: relative; z-index: 1; }
  header { text-align: center; margin-bottom: 3.5vh; }
  header .eyebrow {
    color: var(--blue);
    letter-spacing: 0.3em;
    font-size: clamp(13px, 1.3vw, 18px);
    text-transform: uppercase;
    font-weight: 700;
  }
  header h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    color: var(--cream);
    font-size: clamp(30px, 4.6vw, 58px);
    margin: 10px 0 0;
    letter-spacing: -0.01em;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4vh 4vw; }
  .category {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 20px;
    padding: 24px 24px 20px;
    backdrop-filter: blur(6px);
  }
  .category h2 {
    display: inline-block;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    color: var(--cream);
    background: linear-gradient(100deg, var(--maroon) 0%, var(--maroon-light) 100%);
    font-size: clamp(14px, 1.5vw, 18px);
    margin: 0 0 16px;
    padding: 8px 20px;
    border-radius: 12px;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; align-items: baseline; gap: 10px;
    font-size: clamp(17px, 1.7vw, 24px);
    font-weight: 500;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .item:last-child { border-bottom: none; }
  .item-name { white-space: nowrap; }
  .dots { flex: 1; border-bottom: 2px dotted rgba(216,207,175,0.25); transform: translateY(-6px); }
  .item-price { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--blue); }
  .state {
    position: relative; z-index: 1; text-align: center; margin-top: 10vh;
    color: var(--mauve); font-size: clamp(16px, 1.6vw, 22px);
  }
</style>
</head>
<body>
  <div class="content">
    <header>
      <div class="eyebrow">BAPS Chicago &middot; Diwali</div>
      <h1>Fresh Food Menu</h1>
    </header>
    <div class="grid" id="grid"></div>
    <div class="state" id="state" hidden>Loading menu&hellip;</div>
  </div>

<script>
  // ---- Point this at your sheet ----
  var SHEET_ID = '1G4Bwv_KSM-tPCvDV-A2D6amdks73Un0qHPcwxbp7gCw';
  var GID = 0; // first tab, regardless of its name
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + GID;
  var REFRESH_MS = 60000;

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Minimal CSV parser: handles quoted fields and escaped quotes ("").
  function parseCsv(text) {
    var rows = [], row = [], field = '', inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i], next = text[i + 1];
      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && next === '\n') i++;
          row.push(field); field = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
        } else field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function buildCategories(rows) {
    var header = rows[0] || [];
    var idx = {
      category: header.indexOf('Category'),
      item: header.indexOf('Item'),
      price: header.indexOf('Price'),
      available: header.indexOf('Available'),
    };
    var categories = {}, order = [];
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var item = row[idx.item];
      if (!item) continue;
      var available = String(row[idx.available]).trim().toUpperCase() !== 'N';
      if (!available) continue; // unavailable items are left off the menu entirely
      var category = row[idx.category] || 'Other';
      if (!categories[category]) { categories[category] = []; order.push(category); }
      categories[category].push({ name: item, price: row[idx.price] });
    }
    order = order.filter(function (cat) { return categories[cat].length > 0; }); // drop categories with nothing left to show
    return { categories: categories, order: order };
  }

  function render(data) {
    var grid = document.getElementById('grid');
    var state = document.getElementById('state');
    var html = data.order.map(function (cat) {
      var items = data.categories[cat].map(function (it) {
        return (
          '<li class="item">' +
          '<span class="item-name">' + escapeHtml(it.name) + '</span>' +
          '<span class="dots"></span>' +
          '<span class="item-price">$' + escapeHtml(it.price) + '</span>' +
          '</li>'
        );
      }).join('');
      return (
        '<section class="category"><h2>' + escapeHtml(cat) + '</h2><ul>' + items + '</ul></section>'
      );
    }).join('');
    grid.innerHTML = html;
    state.hidden = true;
    grid.hidden = false;
  }

  function load() {
    fetch(CSV_URL, { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('fetch failed'); return res.text(); })
      .then(function (text) { render(buildCategories(parseCsv(text))); })
      .catch(function () {
        // Keep whatever is currently shown; only show the error if we have nothing yet.
        var grid = document.getElementById('grid');
        if (!grid.innerHTML) {
          document.getElementById('state').hidden = false;
          document.getElementById('state').textContent = 'Menu unavailable — check connection.';
        }
      });
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
