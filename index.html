<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwali Fresh Food Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Jost:wght@400;500;600;700&family=Alex+Brush&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #0c183a;
    --bg-b: #142a52;
    --bg-c: #030712;
    --surface: rgba(255,255,255,0.045);
    --gold: #8ecae6;
    --coral: #e3b23c;
    --cream: #f0f2f5;
    --muted: #9fb3c8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    overflow: hidden; /* the stage is scaled to fit, so the page itself never scrolls */
  }
  body {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 900px 600px at 15% -5%, rgba(142,202,230,0.14), transparent 60%),
      radial-gradient(ellipse 900px 700px at 100% 100%, rgba(227,178,60,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
  }
  /* .content always fills ~94% of the viewport width (grid columns are fr-based,
     so they stretch to use all of it, however many items are on the menu).
     JS scales the root font-size up or down so text/padding/gaps (all in rem)
     grow or shrink to fill the available height without ever scrolling -
     width-fill and height-fit are handled independently, so there's no
     letterboxing on the sides. */
  .content {
    position: relative; z-index: 1;
    width: 94vw;
    padding: 2.25rem 0;
    box-sizing: border-box;
    display: flex;
    align-items: stretch;
    column-gap: 3vw;
  }
  /* Sidebar: logo + decorative title, pinned to roughly the left fifth
     of the screen. */
  .sidebar {
    flex: 0 0 20%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .logo { display: block; margin: 0 auto 1.2rem; height: 5.6rem; width: auto; }
  .title-script { color: var(--coral); }
  .title-script span { display: block; }
  .title-script .word-diwali {
    font-family: 'Alex Brush', cursive;
    font-size: 7.2rem;
    line-height: 0.75; /* tight so "Menu" sits right under its baseline, as one lockup */
  }
  .title-script .word-menu {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.3em; /* wide tracking reads as a caption under the script, not a second headline */
    text-transform: uppercase;
    margin-top: -0.4rem;
  }
  .menu { flex: 1; min-width: 0; }
  /* Left column: one category spanning the full height. Right column: the
     remaining categories stacked and sharing that same height equally. */
  .grid { display: flex; column-gap: 3vw; align-items: stretch; }
  .col { flex: 1; min-width: 0; }
  .col-left { display: flex; }
  .col-left .category { flex: 1; display: flex; flex-direction: column; }
  .col-left .category ul { flex: 1; }
  .col-right { display: flex; flex-direction: column; row-gap: 2.25rem; }
  .col-right .category { flex: 1; }
  .category {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 1.25rem;
    padding: 1.375rem 1.625rem;
    backdrop-filter: blur(6px);
  }
  /* Today's Special sits at the top of the right column with a gold outline
     so it stands out from the regular category boxes below it. */
  .category.special { border: 1px solid var(--gold); }
  .category h2 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    color: var(--coral);
    text-transform: uppercase;
    font-size: 1.875rem;
    margin: 0 0 0.875rem;
    letter-spacing: 0.03em;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; align-items: baseline; gap: 0.625rem;
    font-size: 1.625rem;
    font-weight: 500;
    padding: 0.625rem 0;
  }
  .item-name { white-space: nowrap; }
  .dots { flex: 1; border-bottom: 2px dotted rgba(240,242,245,0.18); transform: translateY(-0.375rem); }
  .item-price { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--gold); }
  .state {
    position: relative; z-index: 1; text-align: center; margin-top: 6vh;
    color: var(--muted); font-size: 1.5rem;
  }
</style>
</head>
<body>
  <div class="content" id="content">
    <div class="sidebar">
      <img class="logo" src="assets/logo.png" alt="An Ocean of Virtues">
      <div class="title-script"><span class="word-diwali">Diwali</span><span class="word-menu">Menu</span></div>
    </div>
    <div class="menu">
      <div class="grid" id="grid"></div>
      <div class="state" id="state" hidden>Loading menu&hellip;</div>
    </div>
  </div>

<script>
  // ---- Point this at your sheet ----
  var SHEET_ID = '1G4Bwv_KSM-tPCvDV-A2D6amdks73Un0qHPcwxbp7gCw';
  var GID = 0; // first tab, regardless of its name
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + GID;
  var REFRESH_MS = 60000;

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Minimal CSV parser: handles quoted fields and escaped quotes ("").
  function parseCsv(text) {
    var rows = [], row = [], field = '', inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i], next = text[i + 1];
      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && next === '\n') i++;
          row.push(field); field = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
        } else field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Day -> real calendar date, used by "Auto" mode to pick the active day.
  // Update these to match the actual event dates once finalized (YYYY-MM-DD,
  // read in the venue's local time). Until then, Auto falls back to Day 1.
  var DAY_DATES = {
    1: '2026-11-07',
    2: '2026-11-08',
    3: '2026-11-09',
    4: '2026-11-10'
  };

  // Finds the column index for each "Day N" header (matches a prefix, so
  // "Day 1 (Sat 11/7)" still matches "Day 1").
  function findDayColumns(header) {
    var days = [];
    for (var n = 1; n <= 4; n++) {
      var prefix = 'Day ' + n;
      var found = -1;
      for (var c = 0; c < header.length; c++) {
        if (String(header[c]).trim().indexOf(prefix) === 0) { found = c; break; }
      }
      days.push(found);
    }
    return days;
  }

  function isChecked(val) {
    var v = String(val || '').trim().toUpperCase();
    return v === 'TRUE' || v === 'Y' || v === 'YES';
  }

  function todayStr() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  }

  // Override cell can be "Auto", "Day 1".."Day 4", or blank (treated as Auto).
  function resolveActiveDay(overrideVal) {
    var m = String(overrideVal || '').trim().match(/^Day\s*([1-4])$/i);
    if (m) return parseInt(m[1], 10);
    var today = todayStr();
    for (var n = 1; n <= 4; n++) {
      if (DAY_DATES[n] === today) return n;
    }
    return 1; // Auto with no date match yet (or dates not configured) -> Day 1
  }

  // A category literally named "Today's Special" (any case) in the sheet is
  // pulled out and always shown first in the right column with its own
  // gold-outlined box, instead of taking a turn in the normal stack.
  var SPECIAL_CATEGORY_NAME = "today's special";

  function buildCategories(rows) {
    var header = rows[0] || [];
    var idx = {
      category: header.indexOf('Category'),
      item: header.indexOf('Item'),
      price: header.indexOf('Price'),
      override: header.indexOf('Override'),
    };
    var dayIdx = findDayColumns(header);

    var overrideVal = '';
    if (idx.override !== -1) {
      for (var r = 1; r < rows.length; r++) {
        var v = rows[r][idx.override];
        if (v && String(v).trim()) { overrideVal = v; break; }
      }
    }
    var activeCol = dayIdx[resolveActiveDay(overrideVal) - 1];

    var categories = {}, order = [];
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var item = row[idx.item];
      if (!item) continue;
      if (activeCol === -1 || !isChecked(row[activeCol])) continue; // not on today's menu
      var category = row[idx.category] || 'Other';
      if (!categories[category]) { categories[category] = []; order.push(category); }
      categories[category].push({ name: item, price: row[idx.price] });
    }
    order = order.filter(function (cat) { return categories[cat].length > 0; }); // drop categories with nothing left to show

    var specials = [], rest = [];
    order.forEach(function (cat) {
      if (String(cat).trim().toLowerCase() === SPECIAL_CATEGORY_NAME) specials = categories[cat];
      else rest.push(cat);
    });

    return { categories: categories, order: rest, specials: specials };
  }

  function categorySection(cat, data) {
    var items = data.categories[cat].map(function (it) {
      return (
        '<li class="item">' +
        '<span class="item-name">' + escapeHtml(it.name) + '</span>' +
        '<span class="dots"></span>' +
        '<span class="item-price">$' + escapeHtml(it.price) + '</span>' +
        '</li>'
      );
    }).join('');
    return (
      '<section class="category"><h2>' + escapeHtml(cat) + '</h2><ul>' + items + '</ul></section>'
    );
  }

  function specialSection(specials) {
    var items = specials.map(function (it) {
      return (
        '<li class="item">' +
        '<span class="item-name">' + escapeHtml(it.name) + '</span>' +
        '<span class="dots"></span>' +
        '<span class="item-price">$' + escapeHtml(it.price) + '</span>' +
        '</li>'
      );
    }).join('');
    return (
      '<section class="category special"><h2>Today\'s Special</h2><ul>' + items + '</ul></section>'
    );
  }

  // Layout: the first category fills the whole left column (spanning both
  // rows). The right column stacks, top to bottom: a "Today's Special" box
  // (only when at least one item is marked Special for the active day),
  // then every other category, sharing the remaining height evenly.
  function render(data) {
    var grid = document.getElementById('grid');
    var state = document.getElementById('state');
    var leftCat = data.order[0];
    var rightCats = data.order.slice(1);
    var html = '';
    if (leftCat) {
      html += '<div class="col col-left">' + categorySection(leftCat, data) + '</div>';
    }
    if (rightCats.length || data.specials.length) {
      html += '<div class="col col-right">';
      if (data.specials.length) {
        html += specialSection(data.specials);
      }
      html += rightCats.map(function (cat) {
        return categorySection(cat, data);
      }).join('');
      html += '</div>';
    }
    grid.innerHTML = html;
    state.hidden = true;
    grid.hidden = false;
    fitToScreen();
  }

  // The grid always fills the viewport width (its columns are fr-based), so
  // the only thing that needs fitting is height: this scales the root
  // font-size so every rem-based text/padding/gap grows or shrinks together
  // to fill the available height without ever needing to scroll, however
  // many items/categories are on the menu. Capped both ways so a very short
  // or very long menu doesn't end up with illegibly huge or tiny text.
  var BASE_FONT_PX = 16;
  var MIN_SCALE = 0.55, MAX_SCALE = 1.5;
  function fitToScreen() {
    var html = document.documentElement;
    var content = document.getElementById('content');
    html.style.fontSize = BASE_FONT_PX + 'px'; // reset to the baseline before measuring
    var naturalHeight = content.scrollHeight;
    if (!naturalHeight) return;
    var scale = window.innerHeight / naturalHeight;
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
    html.style.fontSize = (BASE_FONT_PX * scale) + 'px';
  }
  window.addEventListener('resize', fitToScreen);

  function load() {
    fetch(CSV_URL, { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('fetch failed'); return res.text(); })
      .then(function (text) { render(buildCategories(parseCsv(text))); })
      .catch(function () {
        // Keep whatever is currently shown; only show the error if we have nothing yet.
        var grid = document.getElementById('grid');
        if (!grid.innerHTML) {
          document.getElementById('state').hidden = false;
          document.getElementById('state').textContent = 'Menu unavailable — check connection.';
        }
      });
  }

  fitToScreen();
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
